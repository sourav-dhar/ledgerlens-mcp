# Local stack: `uv run poe up` (or `docker compose up --build -d`).
# Each service runs the exact image deployed to Lambda, hardened the same way:
# read-only root filesystem, no Linux capabilities, no privilege escalation.

x-service: &service
  build: &build
    context: .
    dockerfile: docker/Dockerfile
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  environment: &env
    LOG_LEVEL: info

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:c28c0b700f3f1b5eec14082b31ad6e7c8a566d14386323609c615315e7c0ffc8
    environment:
      POSTGRES_DB: kosha
      POSTGRES_USER: kosha
      POSTGRES_PASSWORD: kosha-local-only
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosha -d kosha"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    <<: *service
    build:
      <<: *build
      args: { SERVICE: core-api }
    image: ledgerlens/core-api:local
    ports: ["127.0.0.1:${CORE_API_PORT:-8701}:8080"]
    environment:
      <<: *env
      DATABASE_URL: postgresql://kosha:kosha-local-only@db:5432/kosha
      # Local stack only; deployed keys come from Secrets Manager (ADR 0013).
      INTERNAL_SIGNING_KEYS: kosha-local-only-signing-key-not-secret
      # Opens the PANs `poe seed` sealed (ADR 0014); deployed stacks use KMS instead.
      PAN_KEYRING_PASSPHRASE: kosha-local-only-pan-keyring
    depends_on:
      db: { condition: service_healthy }

  screening-sim:
    <<: *service
    build:
      <<: *build
      args: { SERVICE: screening-sim }
    image: ledgerlens/screening-sim:local
    ports: ["127.0.0.1:${SCREENING_PORT:-8702}:8080"]

  mcp-gateway:
    <<: *service
    build:
      <<: *build
      args: { SERVICE: mcp-gateway }
    image: ledgerlens/mcp-gateway:local
    ports: ["127.0.0.1:${GATEWAY_PORT:-8700}:8080"]
    environment:
      <<: *env
      CORE_API_URL: http://core-api:8080
      # Must equal core-api's current INTERNAL_SIGNING_KEYS entry (ADR 0013).
      INTERNAL_SIGNING_KEY: kosha-local-only-signing-key-not-secret
    depends_on:
      core-api: { condition: service_healthy }
      screening-sim: { condition: service_healthy }

volumes:
  pgdata:
