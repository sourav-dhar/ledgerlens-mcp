[project]
name = "ledgerlens-mcp"
version = "0.1.0"
description = "Production-grade fintech MCP server on AWS (workspace root)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "httpx",
    "poethepoet",
    "pre-commit",
]
docs = [
    "mkdocs-material",
    "pymdown-extensions",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
kosha-core-api = { workspace = true }
kosha-mcp-gateway = { workspace = true }
kosha-screening-sim = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["services/*/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "A", "C4", "DTZ", "T20", "SIM",
    "PT", "RET", "ARG", "PTH", "ERA", "PL", "TRY", "RUF", "ASYNC", "FAST",
]
ignore = ["PLR0913", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S104", "PLR2004", "ARG001"]
# Diagram generator is a docs build tool, not product code: allow its terse drawing style.
"docs/diagrams/*.py" = ["A002", "E501", "E741", "PLR0917", "T201", "RUF001"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- pyright
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["services"]
exclude = ["**/.venv", "**/__pycache__"]
reportMissingTypeStubs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["services"]
markers = [
    "integration: needs Docker (testcontainers / LocalStack)",
    "e2e: runs against a deployed stack",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["services"]
omit = ["**/tests/**"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

# ---------------------------------------------------------------- tasks
[tool.poe.tasks]
fmt = { cmd = "ruff format .", help = "Format code" }
lint = { cmd = "ruff check .", help = "Lint code" }
typecheck = { cmd = "pyright", help = "Strict type check" }
test = { cmd = "pytest -m 'not integration and not e2e'", help = "Fast unit and tool tests" }
test-all = { cmd = "pytest -m 'not e2e' --cov --cov-report=term --cov-report=xml", help = "All tests except e2e, with coverage" }
check = { sequence = ["lint", "typecheck", "test"], help = "Everything CI runs on every push" }
up = { cmd = "docker compose up --build -d", help = "Start the local stack" }
down = { cmd = "docker compose down", help = "Stop the local stack" }
docs = { cmd = "mkdocs serve", help = "Preview the docs site" }
tunnel = { cmd = "ngrok http 8700", help = "Expose the local MCP gateway (dev only)" }
