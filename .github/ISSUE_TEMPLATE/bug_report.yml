name: Bug report
description: Something behaves differently from its documented contract
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [mcp-gateway, core-api, screening-sim, workers, infra, docs]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tool name and arguments, or the HTTP request, plus the role or scopes used.
      render: shell
    validations:
      required: true
