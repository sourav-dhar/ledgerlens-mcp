[project]
name = "kosha-mcp-gateway"
version = "0.2.0"
description = "LedgerLens MCP gateway: protocol, auth, masking, audit, resilience"
requires-python = ">=3.13,<3.14"
dependencies = ["fastmcp>=4.1", "uvicorn[standard]>=0.54", "pydantic-settings>=2.16"]

[project.scripts]
kosha-serve = "mcp_gateway.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_gateway"
