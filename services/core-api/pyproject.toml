[project]
name = "kosha-core-api"
version = "0.1.0"
description = "Kosha Core Banking API: domain logic and persistence"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.162", "uvicorn[standard]>=0.54", "pydantic-settings>=2.16"]

[project.scripts]
kosha-serve = "core_api.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core_api"
